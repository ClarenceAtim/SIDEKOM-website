<!-- Runs before the page is drawn: picks the visitor's language so the page opens in the right
     language and direction (no flash of French), and starts downloading that language's text.
     Keep this list in line with js/settings.js. -->
<script>
  (function () {
    var root = document.documentElement;
    root.classList.add("js");
    try {
      var supported = ["fr", "en", "es", "pt", "ar"];
      var asked = new URLSearchParams(location.search).get("lang");
      var saved = localStorage.getItem("sidekom-language");
      var browser = (navigator.language || "").slice(0, 2).toLowerCase();
      var language = [asked, saved, browser].filter(function (code) {
        return supported.indexOf(code) > -1;
      })[0] || "fr";
      root.lang = language;
      root.dir = language === "ar" ? "rtl" : "ltr";
      if (language !== "fr") root.classList.add("is-translating");
      var preload = document.createElement("link");
      preload.rel = "preload";
      preload.as = "fetch";
      preload.crossOrigin = "anonymous";
      preload.href = "/languages/" + language + ".json?v=4454694f";
      document.head.appendChild(preload);
    } catch (error) { /* storage blocked: stay in French */ }
  })();
</script>
